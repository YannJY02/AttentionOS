name: Factory check
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - id: verify
        run: node .agents/skills/verify/run all --out "$RUNNER_TEMP/verify"
      - uses: actions/upload-artifact@v4
        with:
          name: attentionos-evidence
          path: |
            ${{ runner.temp }}/verify/public/manifest.json
            ${{ runner.temp }}/verify/public/overview-proof.png
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() && steps.verify.outcome == 'failure'
        with:
          name: attentionos-failed-check
          path: ${{ runner.temp }}/verify/public/manifest.json
          retention-days: 7
          if-no-files-found: ignore
